[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generation-prototype"
version = "0.1.0"
description = "Extensible Long Video Generation Prototype powered by SVD-XT, FastAPI, and L4 GPU optimization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Video Generation Team"}
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.28.0",
    "transformers>=4.38.0",
    "accelerate>=0.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pillow>=9.0.0",
    "numpy>=1.22.0",
    "requests>=2.28.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.8",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
modal = [
    "modal>=0.60.0",
]

[project.scripts]
video-gen = "video_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_gen*"]
